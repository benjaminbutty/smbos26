name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-not-a-real-credential
          PREORDER_RATE_LIMIT_SECRET: ci-build-only-rate-limit-secret

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Apply migrations from clean state
        run: npm run supabase:reset

      - name: Wait for local Auth after clean migration reset
        run: npm run supabase:auth:ready:ci

      - name: Run OpenAI provider safety tests with injected clients
        run: npm run test:openai-provider

      - name: Reset after OpenAI provider acceptance
        run: npm run supabase:reset

      - name: Wait for local Auth after provider reset
        run: npm run supabase:auth:ready:ci

      - name: Run AI-safe Business context tests
        run: npm run test:ai-context

      - name: Reset for strict builder planning tests
        run: npm run supabase:reset

      - name: Wait for local Auth after planning reset
        run: npm run supabase:auth:ready:ci

      - name: Run strict builder planning tests
        run: npm run test:builder-planning

      - name: Run bounded configuration drafting tests
        run: npm run test:builder-configuration-drafting

      - name: Run deterministic configuration draft compiler tests
        run: npm run test:configuration-draft-compiler

      - name: Reset for authenticated configuration proposal orchestration tests
        run: npm run supabase:reset

      - name: Wait for local Auth after configuration proposal reset
        run: npm run supabase:auth:ready:ci

      - name: Run authenticated configuration proposal orchestration tests
        run: npm run test:builder-configuration-proposal

      - name: Reset for authenticated Builder orchestration tests
        run: npm run supabase:reset

      - name: Wait for local Auth after Builder orchestration reset
        run: npm run supabase:auth:ready:ci

      - name: Run authenticated Builder orchestration tests
        run: npm run test:builder-orchestration

      - name: Run deterministic Location Builder boundary tests
        run: npm run test:builder-location-creation

      - name: Run Location intent contract tests
        run: npm run test:location-creation-intent

      - name: Run Location evaluation envelope tests
        run: npm run test:location-creation-evaluation

      - name: Run confirmation-token boundary tests
        run: npm run test:location-service

      - name: Run generic Record intent contract tests
        run: npm run test:record-creation-intent

      - name: Run generic Record deterministic evaluation tests
        run: npm run test:record-creation-evaluation

      - name: Reset for generic Record service tests
        run: npm run supabase:reset

      - name: Wait for local Auth after generic Record reset
        run: npm run supabase:auth:ready:ci

      - name: Run generic Record service integration tests
        run: npm run test:record-creation-service

      - name: Run Builder generic Record orchestration tests
        run: npm run test:builder-record-creation

      - name: Run generic Record-update intent and boundary tests
        run: npm run test:record-update-intent

      - name: Run generic Record-update deterministic evaluation tests
        run: npm run test:record-update-evaluation

      - name: Reset for generic Record-update service tests
        run: npm run supabase:reset

      - name: Wait for local Auth after Record-update reset
        run: npm run supabase:auth:ready:ci

      - name: Run generic Record-update service integration tests
        run: npm run test:record-update-service

      - name: Run Builder generic Record-update orchestration tests
        run: npm run test:builder-record-update

      - name: Reset for minimal Builder UI tests
        run: npm run supabase:reset

      - name: Wait for local Auth after Builder UI reset
        run: npm run supabase:auth:ready:ci

      - name: Run minimal Builder UI tests
        run: npm run test:builder-ui

      - name: Run bounded builder planning evaluation tests
        run: npm run test:builder-evaluation

      - name: Run Terra medium provider profile tests
        run: npm run test:terra-provider-profile

      - name: Run Terra medium qualification gate tests
        run: npm run test:builder-terra-qualification

      - name: Run Terra medium reliability gate tests
        run: npm run test:builder-terra-reliability

      - name: Run configuration drafting evaluation tests
        run: npm run test:builder-configuration-drafting-evaluation

      - name: Run configuration drafting Terra profile tests
        run: npm run test:builder-configuration-drafting-terra-profile

      - name: Run configuration drafting Terra qualification gate tests
        run: npm run test:builder-configuration-drafting-terra-qualification

      - name: Run configuration drafting Terra reliability gate tests
        run: npm run test:builder-configuration-drafting-terra-reliability

      - name: Run Builder preorder amendment task, composer and evaluation tests
        run: npm run test:preorder-amendment

      - name: Reset after builder planning acceptance
        run: npm run supabase:reset

      - name: Wait for local Auth after planning acceptance reset
        run: npm run supabase:auth:ready:ci

      - name: Run deterministic manual question tests
        run: npm run test:manual-questions

      - name: Reset after manual question acceptance
        run: npm run supabase:reset

      - name: Wait for local Auth after manual question reset
        run: npm run supabase:auth:ready:ci

      - name: Run deterministic manual amendment tests
        run: npm run test:manual-amendments

      - name: Reset after manual amendment acceptance
        run: npm run supabase:reset

      - name: Wait for local Auth after manual amendment reset
        run: npm run supabase:auth:ready:ci

      - name: Run AI accounting and usage-control tests
        run: npm run test:ai-accounting

      - name: Run configuration change proposal tests
        run: npm run test:changes

      - name: Run rollback-only configuration validation tests
        run: npm run test:validation

      - name: Run atomic configuration application tests
        run: npm run test:application

      - name: Run mandatory configuration boundary and demo tests
        run: npm run test:configuration-boundary

      - name: Reset for forward configuration rollback tests
        run: npm run supabase:reset

      - name: Wait for local Auth after rollback reset
        run: npm run supabase:auth:ready:ci

      - name: Run forward configuration rollback tests
        run: npm run test:rollback

      - name: Reset for authenticated preview foundation tests
        run: npm run supabase:reset

      - name: Wait for local Auth after preview reset
        run: npm run supabase:auth:ready:ci

      - name: Run authenticated preview foundation tests
        run: npm run test:preview-foundation

      - name: Run authenticated rendered preview tests
        run: npm run test:preview

      - name: Run read-only configuration Changes interface tests
        run: npm run test:changes-ui-read

      - name: Run configuration lifecycle action interface tests
        run: npm run test:changes-ui-actions

      - name: Restart clean Supabase for full integration and RLS tests
        run: |
          npm run supabase:stop
          npm run supabase:start
          npm run supabase:reset

      - name: Wait for local Auth after final clean reset
        run: npm run supabase:auth:ready:ci

      - name: Seed the local demonstration data
        run: npm run demo:seed

      - name: Run full PostgreSQL integration suite
        run: npm run test:integration

      - name: Run PostgreSQL RLS integration suite separately
        run: npm run test:rls

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
