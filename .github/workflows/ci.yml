name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-not-a-real-credential
          PREORDER_RATE_LIMIT_SECRET: ci-build-only-rate-limit-secret

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Apply migrations from clean state
        run: npm run supabase:reset

      - name: Run OpenAI provider safety tests with injected clients
        run: npm run test:openai-provider

      - name: Reset after OpenAI provider acceptance
        run: npm run supabase:reset

      - name: Run AI-safe Business context tests
        run: npm run test:ai-context

      - name: Reset for strict builder planning tests
        run: npm run supabase:reset

      - name: Run strict builder planning tests
        run: npm run test:builder-planning

      - name: Run bounded configuration drafting tests
        run: npm run test:builder-configuration-drafting

      - name: Run deterministic configuration draft compiler tests
        run: npm run test:configuration-draft-compiler

      - name: Run bounded builder planning evaluation tests
        run: npm run test:builder-evaluation

      - name: Run Terra medium provider profile tests
        run: npm run test:terra-provider-profile

      - name: Run Terra medium qualification gate tests
        run: npm run test:builder-terra-qualification

      - name: Run Terra medium reliability gate tests
        run: npm run test:builder-terra-reliability

      - name: Reset after builder planning acceptance
        run: npm run supabase:reset

      - name: Run deterministic manual question tests
        run: npm run test:manual-questions

      - name: Reset after manual question acceptance
        run: npm run supabase:reset

      - name: Run deterministic manual amendment tests
        run: npm run test:manual-amendments

      - name: Reset after manual amendment acceptance
        run: npm run supabase:reset

      - name: Run AI accounting and usage-control tests
        run: npm run test:ai-accounting

      - name: Run configuration change proposal tests
        run: npm run test:changes

      - name: Run rollback-only configuration validation tests
        run: npm run test:validation

      - name: Run atomic configuration application tests
        run: npm run test:application

      - name: Run mandatory configuration boundary and demo tests
        run: npm run test:configuration-boundary

      - name: Reset for forward configuration rollback tests
        run: npm run supabase:reset

      - name: Run forward configuration rollback tests
        run: npm run test:rollback

      - name: Reset for authenticated preview foundation tests
        run: npm run supabase:reset

      - name: Run authenticated preview foundation tests
        run: npm run test:preview-foundation

      - name: Run authenticated rendered preview tests
        run: npm run test:preview

      - name: Run read-only configuration Changes interface tests
        run: npm run test:changes-ui-read

      - name: Run configuration lifecycle action interface tests
        run: npm run test:changes-ui-actions

      - name: Restart clean Supabase for full integration and RLS tests
        run: |
          npm run supabase:stop
          npm run supabase:start
          npm run supabase:reset

      - name: Run PostgreSQL RLS integration tests
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
